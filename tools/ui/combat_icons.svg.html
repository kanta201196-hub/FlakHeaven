<filter id="vol" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">

  <feSpecularLighting in="b" surfaceScale="4" specularConstant="1.1" specularExponent="22" lighting-color="#fff" result="spec"><feDistantLight azimuth="235" elevation="48"/></feSpecularLighting>

  <feComposite in="dif" in2="SourceAlpha" operator="in" result="difIn"/>

  <feComposite in="specIn" in2="shaded" operator="arithmetic" k1="0" k2=".55" k3="1" k4="0" result="lit"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="sb"/><feOffset in="sb" dx="2" dy="5" result="so"/>
  <feFlood flood-color="#000" flood-opacity=".75"/><feComposite in2="so" operator="in" result="shadow"/>
  <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
</filter>
